name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

permissions:
  contents: read

# github.ref keeps runs on other branches from cancelling each other.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      # Major tags are fine: official actions/* only, read-only token, no secrets. Pin to SHAs once a third-party action or secrets are added.
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
